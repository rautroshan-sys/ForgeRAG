# Spring Boot application settings
spring.application.name=forgerag
server.port=8080

# Datasource
spring.datasource.url=jdbc:postgresql://localhost:5432/forgerag
spring.datasource.username=${DB_USER:forgerag}
spring.datasource.password=${DB_PASSWORD:forgerag}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway migrations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Gemini configuration
gemini.api.key=${GEMINI_API_KEY:}
gemini.model.generator=gemini-2.5-flash
gemini.model.evaluator=gemini-2.5-flash

# ForgeRAG runtime
forgerag.agent.max-retries=3
