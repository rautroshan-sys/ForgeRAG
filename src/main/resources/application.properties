spring.application.name=forgerag
server.port=8080

# ── DataSource ─────────────────────────────────────────────────────────────
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/forgerag}
spring.datasource.username=${DB_USER:forgerag}
spring.datasource.password=${DB_PASSWORD:forgerag}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── Flyway ──────────────────────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# ── Gemini ──────────────────────────────────────────────────────────────────
gemini.api.key=${GEMINI_API_KEY}
gemini.model.generator=gemini-3.8-flash
gemini.model.evaluator=gemini-3.8-flash
gemini.model.embedding=gemini-embedding-001

# ── Agent ────────────────────────────────────────────────────────────────────
forgerag.agent.max-retries=3

# ── CRAG Retrieval Confidence ────────────────────────────────────────────────
# pgvector Inner-Product scores are negative (negated for ASC ordering).
# Score closer to 0 = higher similarity. Scores ABOVE this threshold = confident.
# -0.40 is moderate: tune lower (e.g. -0.30) to be stricter, higher (e.g. -0.60) to prefer local docs.
forgerag.retrieval.confidence-threshold=-0.40

# ── CORS ─────────────────────────────────────────────────────────────────────
forgerag.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}

# ── Logging ──────────────────────────────────────────────────────────────────
logging.level.com.forgerag=DEBUG